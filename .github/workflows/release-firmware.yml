name: Release Firmware

on:
  push:
    tags:
      - 'firmware-v*'
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Firmware
    if: startsWith(github.ref, 'refs/tags/firmware-v') || contains(github.event.pull_request.labels.*.name, 'firmware')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry & ESP toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            ~/.rustup/
            firmware/target/
          key: ${{ runner.os }}-esp32c3-cargo-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-esp32c3-cargo-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev dfu-util python3 python3-pip

      - name: Setup Espressif Rust Toolchain (RISC-V)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo install espup
          cargo install ldproxy
          espup install -t esp32c3
          rustup default esp
          set -a
          . "$HOME/export-esp.sh"
          set +a
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: Sync package version to release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#firmware-v}" # Strip 'firmware-v' prefix to extract pure semver
          export VERSION

          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;

          const cargoPath = 'firmware/Cargo.toml';
          const cargoToml = fs.readFileSync(cargoPath, 'utf8').replace(
            /^version = ".*"$/m,
            `version = "${version}"`,
          );
          fs.writeFileSync(cargoPath, cargoToml);
          NODE

      - name: Code Formatting Check
        run: cargo fmt --check
        working-directory: ./firmware
        continue-on-error: true

      - name: Build Firmware (Release)
        run: cargo build --release --target riscv32imc-esp-espidf
        working-directory: ./firmware

      - name: Generate version.json
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#firmware-v}"
          BINARY_NAME="ayphr-firmware"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${BINARY_NAME}"
          SHA256=$(sha256sum "firmware/target/riscv32imc-esp-espidf/release/${BINARY_NAME}" | cut -d' ' -f1)

          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "binaryUrl": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}"
          }
          EOF

          echo "Generated version.json:"
          cat version.json

      - name: Upload Artifacts to Release
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/target/riscv32imc-esp-espidf/release/*.bin
            firmware/target/riscv32imc-esp-espidf/release/ayphr-firmware
            firmware/target/riscv32imc-esp-espidf/release/ayphr-firmware.d
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
