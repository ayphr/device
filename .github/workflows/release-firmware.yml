name: Release Firmware

on:
  push:
    tags:
      - 'firmware-v*'
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Firmware
    if: startsWith(github.ref, 'refs/tags/firmware-v') || contains(github.event.pull_request.labels.*.name, 'firmware')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Cargo registry & ESP toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            ~/.rustup/
            firmware/target/
          key: ${{ runner.os }}-esp32c3-cargo-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-esp32c3-cargo-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev dfu-util python3 python3-pip esptool

      - name: Setup Espressif Rust Toolchain (RISC-V)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v espup >/dev/null 2>&1 || cargo install espup --locked
          command -v ldproxy >/dev/null 2>&1 || cargo install ldproxy --locked
          rustup toolchain install nightly-2026-04-15 --profile minimal --component rust-src --component rustfmt
          espup install -t esp32c3
          rustup toolchain link esp "$(rustup which --toolchain nightly-2026-04-15 rustc | xargs dirname | xargs dirname)"
          rustup default esp
          set -a
          . "$HOME/export-esp.sh"
          set +a
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: Sync package version to release tag
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#firmware-v}" # Strip 'firmware-v' prefix to extract pure semver
          export VERSION

          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;

          const cargoPath = 'firmware/Cargo.toml';
          const cargoToml = fs.readFileSync(cargoPath, 'utf8').replace(
            /^version = ".*"$/m,
            `version = "${version}"`,
          );
          fs.writeFileSync(cargoPath, cargoToml);
          NODE

      - name: Code Formatting Check
        run: cargo fmt --check
        working-directory: ./firmware
        continue-on-error: true

      - name: Build Firmware (Release)
        run: cargo build --release --target riscv32imc-esp-espidf
        working-directory: ./firmware

      - name: Generate OTA app image
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        shell: bash
        run: |
          BINARY_DIR="firmware/target/riscv32imc-esp-espidf/release"
          BINARY="${BINARY_DIR}/ayphr-firmware"
          ESTOOL="esptool.py"
          command -v "$ESTOOL" >/dev/null 2>&1 || ESTOOL="esptool"
          "$ESTOOL" --chip esp32c3 elf2image \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            --output "${BINARY}.bin" "${BINARY}"
          echo "Generated OTA app image:"
          ls -la "${BINARY}.bin"

      - name: Sign OTA app image
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        shell: bash
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const key = process.env.FIRMWARE_SIGNING_KEY;
          if (!key) {
            console.error('FIRMWARE_SIGNING_KEY secret is not configured');
            process.exit(1);
          }

          const binPath =
            'firmware/target/riscv32imc-esp-espidf/release/ayphr-firmware.bin';
          const data = fs.readFileSync(binPath);
          const digest = crypto.createHash('sha256').update(data).digest();

          const privateKey = crypto.createPrivateKey({
            key: Buffer.from(key, 'base64'),
            format: 'der',
            type: 'pkcs8',
          });
          const signature = crypto.sign(null, digest, privateKey);

          // Re-verify against the public key embedded in the firmware before
          // publishing. A mismatched or misconfigured key fails the release
          // instead of shipping an image devices will reject.
          const embeddedPublicKey =
            'b88322aabdababfcf284f9e2a2c75748868cce2418d3e010e7c27c3a60e8671b';
          const spkiPrefix = '302a300506032b6570032100';
          const publicKey = crypto.createPublicKey({
            key: Buffer.from(spkiPrefix + embeddedPublicKey, 'hex'),
            format: 'der',
            type: 'spki',
          });
          if (!crypto.verify(null, digest, publicKey, signature)) {
            console.error('Firmware signature does not match the embedded public key');
            process.exit(1);
          }

          const hex = signature.toString('hex');
          fs.writeFileSync(`${binPath}.sig`, `${hex}\n`);
          fs.writeFileSync('firmware-signature.txt', hex);
          console.log(`Signed ${binPath} (${hex.length / 2}-byte Ed25519 signature)`);
          NODE

      - name: Generate version.json
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#firmware-v}"
          BINARY_NAME="ayphr-firmware"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${BINARY_NAME}.bin"
          SHA256=$(sha256sum "firmware/target/riscv32imc-esp-espidf/release/${BINARY_NAME}.bin" | cut -d' ' -f1)
          SIGNATURE=$(cat firmware-signature.txt)

          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "binaryUrl": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}",
            "signature": "${SIGNATURE}"
          }
          EOF

          echo "Generated version.json:"
          cat version.json

      - name: Stage release files
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        shell: bash
        run: |
          BINARY_DIR="firmware/target/riscv32imc-esp-espidf/release"
          mkdir -p dist
          cp "${BINARY_DIR}/ayphr-firmware.bin" dist/
          cp "${BINARY_DIR}/ayphr-firmware.bin.sig" dist/
          cp "${BINARY_DIR}/ayphr-firmware" dist/
          cp "${BINARY_DIR}/ayphr-firmware.d" dist/
          cp version.json dist/
          ls -la dist

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: dist/
          if-no-files-found: error

  release:
    name: Publish Firmware Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/firmware-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-release

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            ayphr-firmware.bin
            ayphr-firmware.bin.sig
            ayphr-firmware
            ayphr-firmware.d
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest to firmware-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view firmware-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload firmware-latest version.json ayphr-firmware.bin.sig \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create firmware-latest version.json ayphr-firmware.bin.sig \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "Firmware latest" \
              --notes "Stable firmware update manifest referenced by the Companion app. Do not delete."
          fi
