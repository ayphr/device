name: Release Firmware

on:
  push:
    tags:
      - 'firmware-v*'
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, labeled]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test Firmware
    if: startsWith(github.ref, 'refs/tags/firmware-v') || contains(github.event.pull_request.labels.*.name, 'firmware')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry & ESP toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            ~/.rustup/
            firmware/target/
          key: ${{ runner.os }}-esp32-cargo-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-esp32-cargo-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev dfu-util python3 python3-pip

      - name: Setup Xtensa Rust Toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: "esp32"
          ldproxy: true

      - name: Code Formatting Check
        run: cargo fmt --check
        working-directory: ./firmware

      - name: Cargo Check (Fast linting)
        run: cargo check --target xtensa-esp32-espidf
        working-directory: ./firmware

      - name: Build Firmware (Release)
        run: cargo build --release --target xtensa-esp32-espidf
        working-directory: ./firmware

      - name: Upload Artifacts to Release
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/target/xtensa-esp32-espidf/release/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
