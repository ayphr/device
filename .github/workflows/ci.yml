name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (TypeScript, ESLint, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  rust:
    name: Rust (shared + companion)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libudev-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            shared/target/
            companion/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('shared/Cargo.lock', 'companion/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cargo fmt --manifest-path shared/Cargo.toml --check
          cargo fmt --manifest-path companion/src-tauri/Cargo.toml --check

      - name: Test shared protocol crate
        run: cargo test --manifest-path shared/Cargo.toml

      - name: Test companion
        run: cargo test --manifest-path companion/src-tauri/Cargo.toml

  firmware-fmt:
    name: Firmware (formatting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +stable fmt --manifest-path firmware/Cargo.toml --check
