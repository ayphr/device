name: App Release

on:
  push:
    tags:
      - 'app-v*'

jobs:
  build-and-upload:
    name: Build ${{ matrix.platform }} (${{ matrix.target || 'default' }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            apt-packages: >-
              libwebkit2gtk-4.1-dev
              libappindicator3-dev
              librsvg2-dev
              patchelf
              pkg-config
              libudev-dev
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            apt-packages: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            apt-packages: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
            apt-packages: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Must stay identical to warm-app-cache.yml (same shared-key and
          # workspaces, no workflow-level env): tag-scoped caches are unreadable
          # by other tags, so releases restore from the cache the warm workflow
          # saves on main. The matrix target keeps the two macOS jobs from
          # fighting over a single cache key.
          workspaces: companion/src-tauri -> target
          shared-key: app-release-${{ matrix.target || 'host' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Install frontend dependencies
        run: cd companion && npm ci

      - name: Sync package version to release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#app-v}" # Strip 'app-v' prefix to extract pure semver
          export VERSION

          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;

          const packageJson = JSON.parse(fs.readFileSync('companion/package.json', 'utf8'));
          packageJson.version = version;
          fs.writeFileSync('companion/package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const tauriConfig = JSON.parse(fs.readFileSync('companion/src-tauri/tauri.conf.json', 'utf8'));
          tauriConfig.version = version;
          fs.writeFileSync('companion/src-tauri/tauri.conf.json', `${JSON.stringify(tauriConfig, null, 2)}\n`);

          const cargoPath = 'companion/src-tauri/Cargo.toml';
          const cargoToml = fs.readFileSync(cargoPath, 'utf8').replace(
            /^version = ".*"$/m,
            `version = "${version}"`,
          );
          fs.writeFileSync(cargoPath, cargoToml);
          NODE

      - name: Build and upload Tauri release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          generateReleaseNotes: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  publish-updater-feed:
    name: Publish updater feed
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build merged updater feed from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p feed/sigs

          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern '*.sig' --dir feed/sigs

          gh release view "$RELEASE_TAG" \
            --repo "$REPO" \
            --json assets > feed/assets.json

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          from datetime import datetime, timezone

          tag = os.environ['RELEASE_TAG']
          sig_dir = pathlib.Path('feed/sigs')

          with open('feed/assets.json') as handle:
              assets = json.load(handle)['assets']
          api_url = {asset['name']: asset['apiUrl'] for asset in assets}

          def classify(bundle):
              if bundle.endswith('.app.tar.gz'):
                  if '_aarch64.' in bundle:
                      return 'darwin', 'aarch64', 'app'
                  if '_x64.' in bundle or '_x86_64.' in bundle:
                      return 'darwin', 'x86_64', 'app'
              elif bundle.endswith('.AppImage'):
                  return 'linux', 'x86_64', 'appimage'
              elif bundle.endswith('.deb'):
                  return 'linux', 'x86_64', 'deb'
              elif bundle.endswith('.rpm'):
                  return 'linux', 'x86_64', 'rpm'
              elif bundle.endswith('.msi'):
                  return 'windows', 'x86_64', 'msi'
              elif bundle.endswith('.exe'):
                  return 'windows', 'x86_64', 'nsis'
              return None

          platforms = {}
          for sig_path in sorted(sig_dir.glob('*.sig')):
              bundle = sig_path.name[: -len('.sig')]
              target = classify(bundle)
              if target is None or bundle not in api_url:
                  continue
              os_name, arch, kind = target
              platforms[f'{os_name}-{arch}-{kind}'] = {
                  'signature': sig_path.read_text(),
                  'url': api_url[bundle],
              }

          # The bare `{os}-{arch}` keys are what the updater requests. Mirror
          # tauri-action's bundle preferences: AppImage on Linux, MSI on
          # Windows, and the macOS `.app` archive.
          preferred = {
              'darwin-aarch64': 'darwin-aarch64-app',
              'darwin-x86_64': 'darwin-x86_64-app',
              'linux-x86_64': 'linux-x86_64-appimage',
              'windows-x86_64': 'windows-x86_64-msi',
          }
          for base, specific in preferred.items():
              if specific in platforms:
                  platforms[base] = platforms[specific]

          version = tag[len('app-v') :] if tag.startswith('app-v') else tag
          feed = {
              'version': version,
              'notes': '',
              'pub_date': datetime.now(timezone.utc)
              .isoformat()
              .replace('+00:00', 'Z'),
              'platforms': platforms,
          }
          with open('feed/latest.json', 'w') as handle:
              json.dump(feed, handle, indent=2)

          required = {
              'darwin-x86_64',
              'darwin-aarch64',
              'linux-x86_64',
              'windows-x86_64',
          }
          missing = required - set(platforms)
          if missing:
              sys.exit(f'latest.json is missing platforms: {sorted(missing)}')
          print(f'latest.json covers: {sorted(platforms)}')
          PY

      - name: Publish feed to app-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view app-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload app-latest feed/latest.json \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create app-latest feed/latest.json \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "App latest" \
              --notes "Stable updater feed referenced by tauri.conf.json. Do not delete."
          fi
