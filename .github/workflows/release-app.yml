name: App Release

on:
  push:
    tags:
      - 'app-v*'

jobs:
  build-and-upload:
    name: Build ${{ matrix.platform }} (${{ matrix.target || 'default' }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            apt-packages: >-
              libwebkit2gtk-4.1-dev
              libappindicator3-dev
              librsvg2-dev
              patchelf
              pkg-config
              libudev-dev
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            apt-packages: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            apt-packages: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
            apt-packages: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Install frontend dependencies
        run: cd companion && npm ci

      - name: Sync package version to release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#app-v}" # Strip 'app-v' prefix to extract pure semver
          export VERSION

          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;

          const packageJson = JSON.parse(fs.readFileSync('companion/package.json', 'utf8'));
          packageJson.version = version;
          fs.writeFileSync('companion/package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const tauriConfig = JSON.parse(fs.readFileSync('companion/src-tauri/tauri.conf.json', 'utf8'));
          tauriConfig.version = version;
          fs.writeFileSync('companion/src-tauri/tauri.conf.json', `${JSON.stringify(tauriConfig, null, 2)}\n`);

          const cargoPath = 'companion/src-tauri/Cargo.toml';
          const cargoToml = fs.readFileSync(cargoPath, 'utf8').replace(
            /^version = ".*"$/m,
            `version = "${version}"`,
          );
          fs.writeFileSync(cargoPath, cargoToml);
          NODE

      - name: Build and upload Tauri release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tagName: ${{ github.ref_name }}
          releaseName: 'App ${{ github.ref_name }}'
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Publish the merged updater feed to a stable tag so installed apps never
  # depend on the shared `releases/latest` alias (which app and firmware
  # releases fight over). Runs after all matrix jobs so the feed is complete.
  publish-updater-feed:
    name: Publish updater feed
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download merged latest.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern latest.json --dir feed

      - name: Validate feed covers every platform
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open('feed/latest.json') as handle:
              platforms = set(json.load(handle).get('platforms', {}))

          required = {'darwin-x86_64', 'darwin-aarch64', 'linux-x86_64', 'windows-x86_64'}
          missing = required - platforms
          if missing:
              sys.exit(f'latest.json is missing platforms: {sorted(missing)}')
          print(f'latest.json covers: {sorted(platforms)}')
          PY

      - name: Publish feed to app-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view app-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload app-latest feed/latest.json \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create app-latest feed/latest.json \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "App latest" \
              --notes "Stable updater feed referenced by tauri.conf.json. Do not delete."
          fi
