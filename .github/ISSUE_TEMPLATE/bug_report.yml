name: Bug Report
description: Report a bug or issue
title: "[Bug]: "
type: Bug
labels: ["triage needed"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the issue.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Companion UI
        - Companion Backend
        - Device Firmware
        - Shared
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
